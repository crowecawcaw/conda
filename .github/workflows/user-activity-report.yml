name: User Activity Report

on:
  # Run every Tuesday at 2 PM UTC (adjust timezone as needed)
  schedule:
    - cron: '0 14 * * 2'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for AWS OIDC authentication

jobs:
  generate-report:
    name: Generate User Activity Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 psycopg2-binary

      - name: Generate activity report
        env:
          # SSM Parameter Store path prefix for database credentials
          SSM_PARAMETER_PREFIX: ${{ secrets.SSM_PARAMETER_PREFIX || '/conda/database' }}
          # CloudWatch namespace (optional)
          CLOUDWATCH_NAMESPACE: ${{ secrets.CLOUDWATCH_NAMESPACE || 'CondaService' }}
        run: |
          python .github/scripts/user_activity_report.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-activity-report-${{ github.run_id }}
          path: user-activity-report.txt
          retention-days: 30
