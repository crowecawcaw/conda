name: User Activity Report

on:
  # Run every Tuesday at 2 PM UTC (adjust timezone as needed)
  schedule:
    - cron: '0 14 * * 2'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-report:
    name: Generate User Activity Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 psycopg2-binary

      - name: Generate activity report
        env:
          # Database credentials (configure these as GitHub secrets)
          DSQL_HOST: ${{ secrets.DSQL_HOST }}
          DSQL_PORT: ${{ secrets.DSQL_PORT }}
          DSQL_DATABASE: ${{ secrets.DSQL_DATABASE }}
          DSQL_USER: ${{ secrets.DSQL_USER }}
          DSQL_PASSWORD: ${{ secrets.DSQL_PASSWORD }}

          # AWS credentials for CloudWatch
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          python .github/scripts/user_activity_report.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-activity-report-${{ github.run_id }}
          path: user-activity-report.txt
          retention-days: 30
